name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'Dockerfile.backend'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'Dockerfile.backend'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore backend/FahrzeugZulassung.sln
    
    - name: Build
      run: dotnet build backend/FahrzeugZulassung.sln --configuration Release --no-restore
    
    - name: Display build info
      run: |
        echo "✅ Backend build successful"
        echo "Projects built:"
        echo "  - FahrzeugZulassung.API"
        echo "  - FahrzeugZulassung.Application"
        echo "  - FahrzeugZulassung.Domain"
        echo "  - FahrzeugZulassung.Infrastructure"

  docker:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -f Dockerfile.backend -t fahrzeugzulassung-api:test ./backend
        echo "✅ Docker image build successful"
    
    - name: Test Docker image
      run: |
        docker images | grep fahrzeugzulassung-api
        echo "✅ Docker image created successfully"
