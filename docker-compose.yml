version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "7000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/data/ikfz.db
      # Add your OAuth2/OIDC settings here via environment variables
      # - JwtSettings__Authority=https://your-idp.com
      # - JwtSettings__Audience=ikfz-api
    volumes:
      - ./data:/data
    networks:
      - ikfz-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:7000/api
    depends_on:
      - backend
    networks:
      - ikfz-network

networks:
  ikfz-network:
    driver: bridge

volumes:
  data:
